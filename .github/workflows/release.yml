# Builds StintView-Setup.exe on Windows and publishes it as a GitHub release.
# Trigger: push a version tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# Installed apps pick up the release automatically (electron-updater reads latest.yml).
# The release text is this version's section of CHANGELOG.md (must exist, see release-notes.mjs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json (setting it here too fails).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Fails before anything is published if CHANGELOG.md lacks this version's section.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Set app version from tag
        shell: bash
        working-directory: apps/overlay
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build and publish installer
        run: pnpm --filter @stintview/overlay release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Alternative app "Backseat Racer" (same code, electron-builder.backseat.yml): its installer
      # and backseat.yml (its update channel) go into the same release.
      - name: Build Backseat Racer and add it to the release
        shell: bash
        run: |
          pnpm --filter @stintview/overlay dist:backseat
          cd apps/overlay/release-backseat
          gh release upload "$GITHUB_REF_NAME" BackseatRacer-Setup.exe BackseatRacer-Setup.exe.blockmap backseat.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes on the GitHub release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
